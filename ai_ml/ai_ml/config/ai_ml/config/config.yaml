model:
  weights: "models/best.pt"
  device: "cuda"   # or "cpu"
processing:
  target_fps: 3
inference:
  confidence_threshold: 0.4
classes:
  enabled:
    - pothole
    - open_manhole
output:
  thumbnail_dir: "ai_ml/outputs/thumbs"
ocr:
  enabled: true
training:
  dataset_yaml: "dataset/data.yaml"
  epochs: 50
  batch_size: 16
  image_size: 640
  learning_rate: 0.01
  workers: 4
  output_dir: "ai_ml/outputs/training"
