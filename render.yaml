services:
  - type: web
    name: civitrak-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: civitrak-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false        # Set this manually in the Render dashboard to your Vercel URL
      - key: SECRET_KEY
        generateValue: true
    autoDeploy: true
    healthCheckPath: /health

databases:
  - name: civitrak-db
    plan: free
    databaseName: civitrak
    user: civitrak
